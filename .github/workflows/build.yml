name: duo-build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      board_target:
        description: >
          Full board target name (overrides model/toolchain/flash_type).
          Available targets:
            milkv-duo-musl-riscv64-sd,
            milkv-duo256m-glibc-arm64-sd,
            milkv-duo256m-musl-riscv64-sd,
            milkv-duos-glibc-arm64-emmc,
            milkv-duos-glibc-arm64-sd,
            milkv-duos-musl-riscv64-emmc,
            milkv-duos-musl-riscv64-sd
        required: false
        type: string
        default: ''
      model:
        description: 'Board model (ignored if board_target is set)'
        required: false
        type: choice
        options:
          - duo256m
          - duo
          - duos
        default: 'duo256m'
      toolchain:
        description: 'Toolchain to use (ignored if board_target is set)'
        required: false
        type: choice
        options:
          - musl-riscv64
          - glibc-arm64
        default: 'musl-riscv64'
      flash_type:
        description: 'Flash/storage type (ignored if board_target is set)'
        required: false
        type: choice
        options:
          - sd
          - emmc
        default: 'sd'
      debug:
        description: 'Enable debug mode'
        required: false
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      build_verbose:
        description: 'Verbose build output'
        required: false
        type: choice
        options:
          - '1'
          - '0'
        default: '1'
      enable_bootlogo:
        description: 'Enable boot logo'
        required: false
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      sensor:
        description: 'Sensor type'
        required: false
        type: string
        default: 'sony_imx327'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Determine Build Target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.board_target }}" ]; then
            echo "board=${{ inputs.board_target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "board=milkv-${{ inputs.model }}-${{ inputs.toolchain }}-${{ inputs.flash_type }}" >> "$GITHUB_OUTPUT"
          else
            echo "board=milkv-duo256m-musl-riscv64-sd" >> "$GITHUB_OUTPUT"
          fi

      - name: Print Build Configuration
        run: |
          echo "Board target: ${{ steps.target.outputs.board }}"
          echo "Event: ${{ github.event_name }}"

      - name: Update Apt Cache
        run: sudo apt update

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Software
        run: |
          sudo apt install -y pkg-config build-essential ninja-build automake autoconf libtool wget curl \
                              git gcc libssl-dev bc slib squashfs-tools android-sdk-libsparse-utils jq tree \
                              python3-distutils scons parallel tree python3-dev python3-pip device-tree-compiler \
                              ssh cpio fakeroot libncurses5 flex bison libncurses5-dev genext2fs rsync unzip \
                              dosfstools mtools tcl openssh-client cmake expect python-is-python3 python3-jinja2 zstd

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Checkout Host Tools
        uses: actions/checkout@v4
        with:
          repository: 'milkv-duo/host-tools'
          path: 'host-tools'

      - name: Download packages
        run: |
          wget https://github.com/milkv-duo/duo-buildroot-sdk-v2/releases/download/dl/dl.tar
          tar xf dl.tar -C buildroot/

      - name: Build ${{ steps.target.outputs.board }}
        env:
          DEBUG: ${{ inputs.debug || '0' }}
          BUILD_VERBOSE: ${{ inputs.build_verbose || '1' }}
          ENABLE_BOOTLOGO: ${{ inputs.enable_bootlogo || '0' }}
          SENSOR: ${{ inputs.sensor || 'sony_imx327' }}
        run: |
          ./build.sh ${{ steps.target.outputs.board }}

      - name: Compress ${{ steps.target.outputs.board }}
        run: |
          pushd out
            zstd *
          popd

      - name: Upload ${{ steps.target.outputs.board }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.board }}
          path: out/*.zst
          retention-days: 30
